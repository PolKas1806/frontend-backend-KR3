<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Личный сайт студента-разработчика - контакты">
    <title>Проекты - StudentDev Portfolio</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <div class="page">
        <!-- Header -->
        <header class="header">
            <div class="container">
                <div class="header__content">
                    <h1 class="header__title">Мерзликин Иван</h1>
                    <p class="header__subtitle">Студент-разработчик</p>
                </div>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="nav" aria-label="Основная навигация">
            <div class="container">
                <ul class="nav__list">
                    <li class="nav__item">
                        <a href="../index.html" class="nav__link">Главная</a>
                    </li>
                    <li class="nav__item">
                        <a href="projects.html" class="nav__link">Проекты</a>
                    </li>
                    <li class="nav__item">
                        <a href="diary.html" class="nav__link">Дневник</a>
                    </li>
                    <li class="nav__item nav__item--active">
                        <a href="contacts.html" class="nav__link" aria-current="page">Контакты</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main">
            <div class="container">
                <div class="contacts__content">
                    <div class="contact-form" aria-labelledby="contactFormTitle">
                        <h2 id="contactFormTitle" class="contact-form__title">Отправить отзыв</h2>

                        <form id="contactForm" class="form" novalidate>
                            <fieldset>
                                <legend class="visually-hidden">Форма обратной связи</legend>

                                <div class="form-group">
                                    <label for="name" class="form-label">Имя <span aria-hidden="true" class="required-mark">*</span></label>
                                    <input id="name" name="name" type="text" class="form__input" required aria-required="true" aria-describedby="nameError">
                                    <span id="nameError" class="form-error" role="alert" aria-live="assertive"></span>
                                </div>

                                <div class="form-group">
                                    <label for="contact" class="form-label">Контакт (email или тг) <span aria-hidden="true" class="required-mark">*</span></label>
                                    <input id="contact" name="contact" type="text" class="form__input" required aria-required="true" aria-describedby="contactError">
                                    <span id="contactError" class="form-error" role="alert" aria-live="assertive"></span>
                                </div>

                                <div class="form-group">
                                    <label for="message" class="form-label">Сообщение <span aria-hidden="true" class="required-mark">*</span></label>
                                    <textarea id="message" name="message" class="form__textarea" required aria-required="true" aria-describedby="messageError"></textarea>
                                    <span id="messageError" class="form-error" role="alert" aria-live="assertive"></span>
                                </div>

                                <div class="form-actions">
                                    <button type="submit" class="button form__button button--primary">Отправить</button>
                                    <button type="button" id="contactReset" class="button button--outline">Очистить</button>
                                </div>
                            </fieldset>
                        </form>

                        <p id="formStatus" class="form-status" aria-live="polite"></p>
                    </div>
                    <div class="contact-info">
                        <h2 class="contact-info__title">Мои контакты</h2>
                        <div class="contact-info__items">
                            <div class="contact-item">
                                <div class="contact-item__content">
                                    <p class="contact-item__title">Email: <p class="contact-item__value">ivan-******@mail.ru</p></p>
                                </div>
                            </div>
                            <div class="contact-item">
                                <div class="contact-item__content">
                                    <p class="contact-item__title">Тг юз: <p class="contact-item__value">@S******n4</p></p>
                                </div>
                            </div>
                            <div class="contact-item">
                                <div class="contact-item__content">
                                    <p class="contact-item__title">GitHub: </p>
                                    <a href="https://github.com/Fayman7/Frontend-And-Backend-Development-KR2/tree/dev" class="contact-item__value">Fayman7</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <div class="footer__content">
                    <p class="footer__copyright">&copy; 2025 StudentDev Portfolio</p>
                    <div class="footer__links">
                        <a href="mailto:student@edu.ru" class="footer__link">ivan-******@mail.ru</a>
                        <a href="https://github.com/Fayman7/Frontend-And-Backend-Development-KR2/tree/dev" class="footer__link">GitHub</a>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    <script>
        (function(){
        const form = document.getElementById('contactForm');
        const status = document.getElementById('formStatus');
        const resetBtn = document.getElementById('contactReset');

        function setError(input, message) {
            const err = document.getElementById(input.getAttribute('aria-describedby'));
            input.setAttribute('aria-invalid', 'true');
            if (err) err.textContent = message;
        }
        function clearError(input) {
            const err = document.getElementById(input.getAttribute('aria-describedby'));
            input.removeAttribute('aria-invalid');
            if (err) err.textContent = '';
        }

        function validate() {
            const name = form.elements['name'];
            const contact = form.elements['contact'];
            const message = form.elements['message'];
            let valid = true;
            // очистка
            [name, contact, message].forEach(clearError);

            if (!name.value.trim()) { setError(name, 'Введите имя'); valid = false; }
            if (!contact.value.trim()) { setError(contact, 'Укажите контакт'); valid = false; }
            if (!message.value.trim()) { setError(message, 'Напишите сообщение'); valid = false; }

            return { valid, firstInvalid: valid ? null : [name, contact, message].find(i => i.hasAttribute('aria-invalid')) };
        }

        form.addEventListener('submit', function(e){
            e.preventDefault();
            const result = validate();
            if (!result.valid) {
            result.firstInvalid.focus();
            status.textContent = 'Пожалуйста, исправьте ошибки в форме.';
            return;
            }
            // Успешная отправка (здесь можно сделать fetch). Для демонстрации — показать сообщение и сбросить форму.
            status.textContent = 'Спасибо! Ваше сообщение отправлено.';
            form.reset();
            [ ...form.elements ].forEach(el => { if (el.getAttribute && el.getAttribute('aria-invalid')) el.removeAttribute('aria-invalid'); });
        });

        resetBtn.addEventListener('click', () => {
            form.reset();
            status.textContent = '';
            [ ...form.elements ].forEach(el => { if (el.getAttribute && el.getAttribute('aria-invalid')) el.removeAttribute('aria-invalid'); const err = document.getElementById(el.getAttribute && el.getAttribute('aria-describedby')); if (err) err.textContent = ''; });
        });
        })();
    </script>
</body>
</html>
